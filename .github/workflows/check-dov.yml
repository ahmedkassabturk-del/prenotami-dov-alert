name: Prenotami DOV monitor

on:
  schedule:
    - cron: "3/5 * * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send a Telegram test only (do not open Prenotami)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: prenotami-dov-monitor
  cancel-in-progress: true

jobs:
  check-dov:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Download monitor code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the pinned browser library
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run local detector tests
        run: python -m unittest discover -s tests -v

      - name: Check DOV and notify Telegram
        id: monitor
        env:
          PRENOTAMI_EMAIL: ${{ secrets.PRENOTAMI_EMAIL }}
          PRENOTAMI_PASSWORD: ${{ secrets.PRENOTAMI_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ github.event.inputs.telegram_test || 'false' }}
        run: python monitor.py

      - name: Stop after the first successful availability alert
        if: steps.monitor.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method PUT
          "repos/${GITHUB_REPOSITORY}/actions/workflows/check-dov.yml/disable"
